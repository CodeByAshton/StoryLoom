# Push a tag that matches manifest.json's version (e.g. `git tag 0.1.0 && git push origin 0.1.0`)
# to build, test and attach main.js, manifest.json and styles.css to a draft GitHub release.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag doesn't match manifest.json version $version" >&2
            exit 1
          fi

      - name: Build and test
        run: |
          npm ci
          npm test
          npm run build

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --draft --generate-notes main.js manifest.json styles.css
